name: Build iOS unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project VOVGiaoThong.xcodeproj -scheme VOVGiaoThong -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VOV Giao Thông+.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VOV-Giao-Thong-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VOV-Giao-Thong-iOS-unsigned-IPA
          path: VOV-Giao-Thong-iOS-unsigned.ipa
          retention-days: 14
